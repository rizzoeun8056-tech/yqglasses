name: Build Hostinger static branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Astro project
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Publish built files to Hostinger branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch dist/.nojekyll
          git -C dist init -b hostinger-site
          git -C dist config user.name 'github-actions[bot]'
          git -C dist config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C dist add -A
          git -C dist commit -m "Build from ${GITHUB_SHA}"
          git -C dist remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C dist push --force origin HEAD:refs/heads/hostinger-site
