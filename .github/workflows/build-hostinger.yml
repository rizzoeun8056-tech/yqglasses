name: Build Hostinger static branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yqglasses-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Astro project
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Publish built files to Hostinger branch
        run: |
          set -euo pipefail
          site_dir="$(mktemp -d)"
          cp -a dist/. "$site_dir/"

          git fetch origin hostinger-site:refs/remotes/origin/hostinger-site
          git switch -C hostinger-site origin/hostinger-site
          git rm -r --ignore-unmatch .
          cp -a "$site_dir"/. .
          git add -A

          if git diff --cached --quiet; then
            echo "Published files are unchanged."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push origin HEAD:hostinger-site
